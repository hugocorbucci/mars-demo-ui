# App Platform fragment owned by mars-demo-ui.
# Composed into the parent mars-demo-app spec by scripts/compose-app-spec.mjs.
static_sites:
  - name: web
    github:
      repo: hugocorbucci/mars-demo-ui
      branch: main
      deploy_on_push: true
    environment_slug: html
    source_dir: /public
    index_document: index.html
    error_document: 404.html
    envs:
      - key: API_BASE
        scope: BUILD_TIME
        value: /api
